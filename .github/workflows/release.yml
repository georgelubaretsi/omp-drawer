# The public piebird repository's release builds: pushing a plugin's tag, <plugin>/v<version>,
# builds its native programs for every platform with Bun's official build (tools/release.ts),
# unsigned, attests their build provenance and puts them in a draft release of the tag; the tag
# installer/v<version> does the same for the desktop installers (docs/installer.md). It holds no
# secrets; a release is signed before it is published.
# In the private workspace this file sits at plugins/.github/workflows/, where GitHub never runs it.
# Third-party actions are pinned by commit, with the release as a comment.
name: release

on:
  push:
    tags: ["*/v*"]

permissions:
  contents: read

jobs:
  build:
    # macOS builds every platform (Go and Bun cross-compile) and signs macOS's Bun builds ad hoc,
    # without which macOS kills them at launch.
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and pack
        env:
          TAG: ${{ github.ref_name }}
        run: bun tools/release.ts "$TAG" --out dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="The native programs of ${TAG%/v*} ${TAG##*/v}: see its CHANGELOG.md."
          case $TAG in installer/*) notes="The piebird installer ${TAG##*/v}, for macOS and Windows: see docs/installer.md." ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes "$notes"
