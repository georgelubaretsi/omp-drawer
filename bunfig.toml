[install]
# Supply chain: a version must have been public for 14 days before it's installed, so a
# compromised release has time to be caught and pulled. The harnesses we build for are exempt:
# their packages track the harness people run.
minimumReleaseAge = 1209600
minimumReleaseAgeExcludes = [
  "@oh-my-pi/hashline",
  "@oh-my-pi/omp-stats",
  "@oh-my-pi/omptype",
  "@oh-my-pi/pi-agent-core",
  "@oh-my-pi/pi-ai",
  "@oh-my-pi/pi-catalog",
  "@oh-my-pi/pi-coding-agent",
  "@oh-my-pi/pi-mnemopi",
  "@oh-my-pi/pi-natives",
  "@oh-my-pi/pi-natives-darwin-arm64",
  "@oh-my-pi/pi-natives-darwin-x64",
  "@oh-my-pi/pi-natives-linux-arm64",
  "@oh-my-pi/pi-natives-linux-x64",
  "@oh-my-pi/pi-natives-win32-arm64",
  "@oh-my-pi/pi-natives-win32-x64",
  "@oh-my-pi/pi-tui",
  "@oh-my-pi/pi-utils",
  "@oh-my-pi/pi-wire",
  "@oh-my-pi/snapcompact",
]
